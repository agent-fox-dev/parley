# One hub on the volume parley-data. Exactly one replica, and Recreate rather
# than a rolling update, because a second hub must never run on the same
# data, not even for the length of an update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parley
  labels:
    app.kubernetes.io/name: parley
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: parley
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parley
    spec:
      # The hub's own shutdown bound is 30 seconds; 40 leaves a margin.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parley
          # Replace with the reference of the parley-hub image in your
          # registry. No command and no args: the image's entry point,
          # parleyd, runs with no flags.
          image: parley-hub:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: parley-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/parley
            # Only the file is mounted, so that the bootstrap can still write
            # the admin token file into the config dir on the volume.
            - name: config
              mountPath: /var/lib/parley/config/config.toml
              subPath: config.toml
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: parley-data
        - name: config
          configMap:
            name: parley
