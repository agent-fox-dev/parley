# An example of the Secret parley-secrets: copy it, replace every value and
# apply the copy. The Deployment gives each key to the hub as an environment
# variable, which config.toml reads as ${NAME}.
apiVersion: v1
kind: Secret
metadata:
  name: parley-secrets
  labels:
    app.kubernetes.io/name: parley
type: Opaque
stringData:
  GITHUB_CLIENT_SECRET: replace-me
